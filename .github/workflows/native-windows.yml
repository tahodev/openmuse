name: Native Windows boundary
on: [push, pull_request]
permissions: {contents: read}
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy: {matrix: {python-version: ['3.11','3.12','3.13']}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '${{ matrix.python-version }}'}
      - name: Install and run native boundary tests
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = "1"
          python -m pip install -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -v -o faulthandler_timeout=60 --cov=openmuse.windows_fs --cov-branch --cov-report=term-missing --cov-fail-under=85 tests --ignore=tests/test_path_race.py --ignore=tests/test_bounded_process.py --ignore=tests/test_isolated_worker.py --ignore=tests/test_isolated_worker_demo.py --ignore=tests/test_secret_service.py --ignore=tests/test_memory_verification.py -k "not test_memory_demo and not test_memory_forget"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python examples/e2e_demo.py --auto-approve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python examples/verify_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --force-reinstall (Get-ChildItem dist/*.whl)[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/chat_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
